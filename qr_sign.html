<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scan to Sign</title>
<!-- Phone/iPad side of the QR handoff with local_checkin.html (the offline
     computer check-in app). No Firebase, no OCR, no network of any kind —
     this page only ever talks to the computer by scanning QR codes off its
     screen and showing QR codes back. See local_checkin.html's comments
     near qrSignBtn for the full rationale and the important caveat that
     this has not been tested against real hardware yet — test it well
     before relying on it at the event, and if it's ever flaky, the counter
     can always fall back to signing directly on the computer instead. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{
    --blue:#1a73e8; --blue-bg:#e8f0fe; --border:#dadce0; --text:#202124; --muted:#5f6368;
    --green:#1e8e3e; --green-bg:#e6f4ea; --red:#c5221f; --red-bg:#fce8e6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;margin:0;background:#f6f7f9;color:var(--text);}
  header{background:#fff;border-bottom:1px solid var(--border);padding:14px 16px;text-align:center;}
  header h1{font-size:18px;margin:0;}
  header .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  main{max-width:480px;margin:0 auto;padding:16px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;text-align:center;}
  button{font-size:16px;font-weight:600;border-radius:8px;border:none;padding:14px 16px;cursor:pointer;width:100%;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:disabled{background:#9aa0a6;}
  .btn-secondary{background:#fff;color:var(--blue);border:1px solid var(--blue);}
  .btn-danger{background:#fff;color:var(--red);border:1px solid var(--red);}
  .btn-row{display:flex;gap:10px;margin-top:10px;}
  .btn-row button{flex:1;}
  video{width:100%;border-radius:8px;background:#000;display:block;}
  #sigCanvas{width:100%;height:220px;border:2px solid var(--border);border-radius:8px;background:#fff;touch-action:none;display:block;margin:12px 0;}
  .status{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px;}
  .name-display{font-size:20px;font-weight:700;margin:4px 0;}
  .details-display{font-size:14px;color:var(--muted);}
  .hint{font-size:12px;color:var(--muted);margin-bottom:10px;}
</style>
</head>
<body>

<header>
  <h1>Scan to Sign</h1>
  <div class="sub">No network needed — this stays between your phone and the counter's screen.</div>
</header>

<main>

  <div class="card" id="viewScan">
    <p class="hint">Point your camera at the QR code shown on the counter's computer screen.</p>
    <video id="scanVideo" autoplay playsinline muted></video>
    <div class="status" id="scanStatus"></div>
  </div>

  <div class="card" id="viewSign" style="display:none;">
    <div class="name-display" id="signForName"></div>
    <div class="details-display" id="signForDetails"></div>
    <p class="hint" style="margin-top:12px;">Please sign below with your finger.</p>
    <canvas id="sigCanvas" width="240" height="80"></canvas>
    <div class="btn-row">
      <button class="btn-secondary" id="clearSigBtn">✕ Clear</button>
      <button class="btn-primary" id="submitSigBtn">✓ Submit Signature</button>
    </div>
    <div class="status" id="signStatus"></div>
  </div>

  <div class="card" id="viewReturn" style="display:none;">
    <p class="hint">Show this code to the counter's camera now.</p>
    <div id="returnQrWrap" style="display:flex;justify-content:center;margin:16px 0;"></div>
    <button class="btn-primary" id="doneNextBtn">✓ Done — Scan Next Person</button>
  </div>

</main>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('Offline app cache (service worker) did not register:', err.message);
    });
  });
}

const $ = id => document.getElementById(id);
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// --- Same compact QR encode/decode + line-simplification + camera-scan-loop
// logic as local_checkin.html — kept byte-for-byte compatible since these
// two pages must understand each other's payload format exactly. See
// local_checkin.html's comments near qrSignBtn for the full rationale and
// the important untested-on-real-hardware caveat. ---
function rdpSimplify(points, epsilon){
  if(points.length < 3) return points.slice();
  function perpDist(p, a, b){
    const dx = b[0]-a[0], dy = b[1]-a[1];
    const len = Math.hypot(dx, dy);
    if(len === 0) return Math.hypot(p[0]-a[0], p[1]-a[1]);
    return Math.abs(dy*p[0] - dx*p[1] + b[0]*a[1] - b[1]*a[0]) / len;
  }
  function section(pts){
    if(pts.length < 3) return pts;
    let maxDist = 0, index = 0;
    const a = pts[0], b = pts[pts.length-1];
    for(let i = 1; i < pts.length - 1; i++){
      const d = perpDist(pts[i], a, b);
      if(d > maxDist){ maxDist = d; index = i; }
    }
    if(maxDist > epsilon){
      const left = section(pts.slice(0, index+1));
      const right = section(pts.slice(index));
      return left.slice(0, -1).concat(right);
    }
    return [a, b];
  }
  return section(points);
}
function decodeHandoffPayload(text){
  if(!text || text.indexOf('HS1|') !== 0) return null;
  const parts = text.split('|');
  if(parts.length < 5) return null;
  return { id: parts[1], name: parts[2], company: parts[3], mobile: parts[4] };
}
function encodeSignaturePayload(id, strokes, W, H){
  const SIZE_BUDGET = 900;
  let epsilon = 0.5;
  let payload = null;
  for(let attempt = 0; attempt < 14; attempt++){
    const strokeStrs = strokes.map(stroke => {
      const simplified = rdpSimplify(stroke, epsilon);
      let out = '';
      let prevX = null, prevY = null;
      simplified.forEach((p, i) => {
        const x = Math.round(p[0]), y = Math.round(p[1]);
        if(i === 0){ out += x + ':' + y; }
        else { out += ',' + (x - prevX) + ':' + (y - prevY); }
        prevX = x; prevY = y;
      });
      return out;
    }).filter(Boolean);
    payload = 'SIG1|' + id + '|' + W + 'x' + H + '|' + strokeStrs.join(';');
    if(payload.length <= SIZE_BUDGET || epsilon > 30) break;
    epsilon *= 1.6;
  }
  return payload;
}
let qrScanActive = false;
let qrScanStream = null;
async function startQrScanLoop(videoEl, onDecoded, onError){
  stopQrScanLoop();
  try{
    qrScanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
  }catch(err){
    try{
      qrScanStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    }catch(err2){
      if(onError) onError(err2);
      return;
    }
  }
  videoEl.srcObject = qrScanStream;
  await videoEl.play();
  qrScanActive = true;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  function tick(){
    if(!qrScanActive) return;
    if(videoEl.readyState === videoEl.HAVE_ENOUGH_DATA && videoEl.videoWidth){
      canvas.width = videoEl.videoWidth;
      canvas.height = videoEl.videoHeight;
      ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
      try{
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
        if(code && code.data){
          const stop = onDecoded(code.data);
          if(stop){ stopQrScanLoop(); return; }
        }
      }catch(e){ /* transient decode error — just try the next frame */ }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function stopQrScanLoop(){
  qrScanActive = false;
  if(qrScanStream){
    qrScanStream.getTracks().forEach(t => t.stop());
    qrScanStream = null;
  }
}

// --- Signature pad — records vector points (not just pixels) per stroke,
// since those points are what get compressed and sent back as a QR code.
// Canvas is deliberately small internally (240x80) so captured coordinates
// are already in the compact grid local_checkin.html expects — it's
// CSS-scaled much bigger (see #sigCanvas style) for comfortable finger use.
const sigCanvas = $('sigCanvas');
const sigCtx = sigCanvas.getContext('2d');
let strokes = [];
let currentStroke = null;

function resetSignaturePad(){
  sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
  sigCtx.fillStyle = '#fff';
  sigCtx.fillRect(0, 0, sigCanvas.width, sigCanvas.height);
  strokes = [];
  currentStroke = null;
}
function sigPointerPos(e){
  const rect = sigCanvas.getBoundingClientRect();
  const scaleX = sigCanvas.width / rect.width;
  const scaleY = sigCanvas.height / rect.height;
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}
let sigLastPoint = null;
sigCanvas.addEventListener('pointerdown', e => {
  const p = sigPointerPos(e);
  currentStroke = [[Math.round(p.x), Math.round(p.y)]];
  strokes.push(currentStroke);
  sigLastPoint = p;
  sigCanvas.setPointerCapture(e.pointerId);
  e.preventDefault();
});
sigCanvas.addEventListener('pointermove', e => {
  if(!currentStroke) return;
  const p = sigPointerPos(e);
  sigCtx.strokeStyle = '#1a1a1a';
  sigCtx.lineWidth = 2.5;
  sigCtx.lineCap = 'round';
  sigCtx.lineJoin = 'round';
  sigCtx.beginPath();
  sigCtx.moveTo(sigLastPoint.x, sigLastPoint.y);
  sigCtx.lineTo(p.x, p.y);
  sigCtx.stroke();
  currentStroke.push([Math.round(p.x), Math.round(p.y)]);
  sigLastPoint = p;
  e.preventDefault();
});
function endSigStroke(){ currentStroke = null; }
sigCanvas.addEventListener('pointerup', endSigStroke);
sigCanvas.addEventListener('pointerleave', endSigStroke);
sigCanvas.addEventListener('pointercancel', endSigStroke);
$('clearSigBtn').addEventListener('click', resetSignaturePad);
resetSignaturePad();

// --- The three views: scan → sign → show return code → back to scan ---
let currentSessionId = null;

function startScanning(){
  $('viewScan').style.display = 'block';
  $('viewSign').style.display = 'none';
  $('viewReturn').style.display = 'none';
  $('scanStatus').textContent = 'Looking for a code…';
  startQrScanLoop($('scanVideo'), data => {
    const decoded = decodeHandoffPayload(data);
    if(!decoded) return false; // not our kind of code — keep scanning
    currentSessionId = decoded.id;
    $('signForName').textContent = decoded.name;
    $('signForDetails').textContent = [decoded.company, decoded.mobile].filter(Boolean).join(' · ');
    resetSignaturePad();
    $('viewScan').style.display = 'none';
    $('viewSign').style.display = 'block';
    return true;
  }, err => {
    $('scanStatus').innerHTML = '<span style="color:var(--red);">Camera error: ' + escapeHtml(err.message) + '. Please allow camera access and reload this page.</span>';
  });
}

$('submitSigBtn').addEventListener('click', () => {
  if(!strokes.length){
    $('signStatus').innerHTML = '<span style="color:var(--red);">Please sign first.</span>';
    return;
  }
  const payload = encodeSignaturePayload(currentSessionId, strokes, sigCanvas.width, sigCanvas.height);
  $('viewSign').style.display = 'none';
  $('viewReturn').style.display = 'block';
  $('returnQrWrap').innerHTML = '';
  new QRCode($('returnQrWrap'), {
    text: payload,
    width: 260, height: 260,
    correctLevel: QRCode.CorrectLevel.M
  });
});

$('doneNextBtn').addEventListener('click', () => {
  currentSessionId = null;
  startScanning();
});

window.addEventListener('load', startScanning);
</script>
</body>
</html>
